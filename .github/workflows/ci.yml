name: WebOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=4
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
